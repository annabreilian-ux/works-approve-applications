name: Promote staged production deployment

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Staged Vercel deployment URL that passed smoke testing
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@latest promote "$DEPLOYMENT_URL" --yes --token="${{ secrets.VERCEL_TOKEN }}"
