name: Rotate production passwords

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
      ROTATE_PRODUCTION_PASSWORDS_CONFIRM: I_UNDERSTAND_THIS_ROTATES_PRODUCTION_PASSWORDS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Write protected password rotation input
        shell: bash
        env:
          ROTATION_PAYLOAD_BASE64: ${{ secrets.PRODUCTION_PASSWORD_ROTATION_PAYLOAD_BASE64 }}
        run: printf '%s' "$ROTATION_PAYLOAD_BASE64" | base64 --decode > "$RUNNER_TEMP/rotate-production-passwords-input.json"
      - name: Rotate production passwords
        run: npm run rotate-passwords:production -- "$RUNNER_TEMP/rotate-production-passwords-input.json"
